name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          - os: windows-latest
            php: '8.4'
    steps:
      # Actions are pinned to a full commit, not a tag: a tag can be moved to other code by whoever
      # controls that repository; a commit cannot. The comment says which release it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962   # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          coverage: none

      - name: Syntax check
        shell: bash
        run: |
          for f in $(find skills -name '*.php'); do php -l "$f"; done

      - name: Self-test (no network, no LINE account)
        run: php -d error_reporting=-1 -d display_errors=1 skills/line-security-alerts/scripts/selftest.php

      - name: Demo runs
        run: php skills/line-security-alerts/scripts/demo.php

      - name: Fingerprint tool runs
        run: php skills/line-security-alerts/scripts/fingerprint.php skills
